title = "agent_blueprint_protocol gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Deliberately key-shaped deny-path test fixtures (inert example values, not secrets)"
regexTarget = "line"
regexes = [
  '''eyJhbGciOiJFZERTQSJ9''',
  '''QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVphYmNkZWZnaGk''',
]

# Corpus keys are deterministic public fixtures, never credentials.
# Their public bytes are generated with the conformance corpus.
# The fragment exceptions below identify that fixture material.
[[allowlists]]
description = "Corpus deterministic public keys (SHA-256-seeded Ed25519, public material)"
regexTarget = "line"
regexes = [
  '''WQlg[T]hEsdw5vUa2NVjfS''',
  '''corpus-signature-valid''',
  '''corpus-receipt''',
]

# Corpus-wide fixture exclusion can also hide an accidentally pasted secret.
# The publication privacy scan separately checks the tracked source and history.
# Preserve this limitation when changing fixture handling.
[[allowlists]]
description = "Generated conformance corpus (deterministic public-by-construction fixtures)"
paths = ['''priv/conformance/.*''']
