name: Published package smoke
# Publish calls this after both registries are live and its draft exists.
# Installed replay needs historical tags, not the new version's tag. Dispatch
# can check any published version from a checkout carrying the historical tags.
on:
  workflow_call:
    inputs:
      version:
        description: Published package version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published package version
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    name: Published kit — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out smoke script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the default toolchain and package version
        id: inputs
        run: python scripts/read_release_inputs.py
        shell: pwsh
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.inputs.outputs.node }}
          package-manager-cache: false
      - name: Install the published package and verify its corpus
        env:
          ABP_VERSION: ${{ inputs.version }}
        run: node scripts/postpublish_smoke.mjs "$env:ABP_VERSION"
        shell: pwsh

  livebooks:
    name: Published consumer examples - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      # A workflow call uses Publish's commit; dispatch uses the selected ref.
      # Full history supplies the earlier censuses and signed 0.8.x goldens.
      - name: Check out the consumer driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the default toolchain and package version
        id: inputs
        run: python scripts/read_release_inputs.py
        shell: pwsh
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.inputs.outputs.node }}
          package-manager-cache: false
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.inputs.outputs.elixir }}
          otp-version: ${{ steps.inputs.outputs.otp }}
          version-type: strict
          install-hex: false
      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force
        shell: pwsh
      - name: Verify the published packages and replay release history through them
        env:
          ABP_VERSION: ${{ inputs.version }}
        # Every consumer gate and example document is loaded from the
        # checksum-verified published packages. The checkout supplies only
        # transport, extraction, and the release tags the installed replay reads.
        run: elixir scripts/verify_release_packages.exs --registry "$env:ABP_VERSION"
        shell: pwsh
