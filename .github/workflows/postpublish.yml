name: Published package smoke
# The release run calls this workflow once Hex is live and the GitHub release
# exists, so every release verifies its published packages and a failure here
# turns the release run red. A maintainer can also run it for any released
# version.
on:
  workflow_call:
    inputs:
      version:
        description: Published package version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published package version
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    name: Published kit — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out smoke script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Install the published package and verify its corpus
        env:
          ABP_VERSION: ${{ inputs.version }}
        run: node scripts/postpublish_smoke.mjs "$env:ABP_VERSION"
        shell: pwsh

  livebooks:
    name: Published consumer examples - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      # A release run checks out its tag; a manual run checks out the chosen
      # branch, so any released version can be re-verified with the current driver.
      - name: Check out the consumer driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"
          install-hex: false
      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force
        shell: pwsh
      - name: Fetch the published gates and run every published consumer example
        env:
          ABP_VERSION: ${{ inputs.version }}
        # The checkout supplies transport/extraction only. Every gate and input
        # document is loaded from the checksum-verified published packages.
        run: elixir scripts/consumer_examples.exs --registry "$env:ABP_VERSION"
        shell: pwsh
