name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Docs-only pushes skip this heavy workflow to save CI minutes; the
    # lean doc-gates workflow (docs-gates.yml) triggers on exactly these
    # paths and runs every gate that reads them. The two lists are kept
    # identical by test/architecture/ci_trigger_filter_test.exs.
    paths-ignore: ['*.md', 'docs/**', 'documentation/**', 'spec/**/*.md', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-syntax:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint pinned to its release commit for v1.7.12, verified first-hand
      # against the rhysd/actionlint tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database.
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks pinned to its release commit for v8.30.1, verified first-hand
      # against the gitleaks/gitleaks tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database. Scans the
      # complete commit history, not just the head tree.
      - name: Run gitleaks over full history
        run: go run github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e git --config .gitleaks.toml --redact --no-banner

  spec-extraction:
    name: Specification extraction
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: |
          sudo apt-get update
          sudo apt-get install -y git-filter-repo

      # The dev pin (mirrors .tool-versions).
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"
          install-hex: false

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      # The submission-time extraction, tested: the two governed paths are
      # filtered out of a scratch clone, and the extracted tree must render
      # with no dangling references (the same assertions the local
      # `mix spec.extraction` gate runs on every build).
      - name: Extract the standalone specification tree
        run: |
          git clone --no-local "$GITHUB_WORKSPACE" /tmp/spec-extraction-clone
          git -C /tmp/spec-extraction-clone filter-repo --path spec/ --path priv/conformance

      - name: Verify the extracted tree renders self-contained
        run: elixir scripts/check_spec_extraction.exs --tree /tmp/spec-extraction-clone

  compatibility:
    name: Supported toolchain — ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The enforced support matrix (docs/adr/supported-otp-set.md):
          # Elixir 1.19 on OTP 28, and Elixir 1.20 on every supported OTP
          # major. OTP 29 is exercised by the quality job on the dev pin;
          # every supported major has a lane, and no lane sits outside
          # config/config.exs's supported set. Tests and the conformance
          # corpus only; the full quality battery stays on the dev pin.
          - lane: "Elixir 1.19 / OTP 28"
            elixir: "1.19.6-otp-28"
            otp: "28.5"
          - lane: "Elixir 1.20 / OTP 28"
            elixir: "1.20.4-otp-28"
            otp: "28.5"
          - lane: "Elixir 1.20 / OTP 27"
            elixir: "1.20.4-otp-27"
            otp: "27.3.4.17"
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-hex: false

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests and the conformance corpus
        run: |
          mix test
          mix conformance.verify

  quality:
    name: Complete quality and package boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      # The dev pin (mirrors .tool-versions): Elixir 1.20.x on OTP 29.x.
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"
          install-hex: false

      # Publication guards run independently of the build and tests. Fork
      # pull requests without the secret skip loudly; every other run enforces.
      - name: Check public privacy over full history
        run: elixir scripts/check_public_privacy.exs scripts/public_privacy.json
        env:
          ABP_PUBLIC_PRIVACY_HMAC_KEY: ${{ secrets.ABP_PUBLIC_PRIVACY_HMAC_KEY }}
          ABP_PRIVACY_SCAN: ${{ github.event.pull_request.head.repo.fork == true && 'fork-skip' || 'enforce' }}

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Install dependencies
        run: mix deps.get

      # The agreement gate proves the npm kit against the escript, so the
      # kit (gitignored dist/) must be built from this same tree first.
      - name: Build the npm kit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run complete quality gate
        run: mix quality
        # includes release.asset: the standalone verifier kit must run
        # green over the shipped archive's corpus on every push

  platforms:
    name: Consumer and contributor — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      MIX_ENV: test
    steps:
      - name: Check out byte-exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Verify checkout bytes and paths
        run: node scripts/check_checkout.mjs
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"
          install-hex: false

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force
      - name: Install dependencies and compile
        run: |
          mix deps.get
          mix compile --warnings-as-errors
      - name: Build and exercise the kit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node dist/kit/cli.mjs
      - name: Run contributor tests and both conformance adapters
        run: |
          mix test --seed 42
          mix conformance.verify
          mix conformance.product
          mix typescript.guide

  typescript-consumers:
    name: TypeScript consumer / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ["26.13.0"]
    steps:
      - name: Check out byte-exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Build the typed library and CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node dist/kit/cli.mjs
          node scripts/check_typescript_consumer.mjs
      - name: Exercise both conformance adapters and the harness
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"
          install-hex: false

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force
      - name: Verify the harness
        run: |
          mix deps.get
          mix escript.build
          node scripts/check_conformance_product.mjs
