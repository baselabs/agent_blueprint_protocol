name: CI

on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Read suite toolchains
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 0.2 min, run 44284713586.
    timeout-minutes: 5
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      nodejs: ${{ steps.versions.outputs.nodejs }}
      golang: ${{ steps.versions.outputs.golang }}
      beam_lanes: ${{ steps.versions.outputs.beam_lanes }}
      nodejs_lanes: ${{ steps.versions.outputs.nodejs_lanes }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read defaults and compatibility lanes
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

  workflow-syntax:
    needs: toolchain
    name: Workflow syntax
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 0.5 min, run 44274680272.
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go uses the default read from .tool-versions.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.toolchain.outputs.golang }}
          cache: false

      - name: Verify installed Go versions
        shell: bash
        env:
          TOOLCHAIN_GOLANG: ${{ needs.toolchain.outputs.golang }}
        run: scripts/toolchain.sh --installed golang="$TOOLCHAIN_GOLANG"

      # actionlint pinned to its release commit for v1.7.12, verified first-hand
      # against the rhysd/actionlint tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database.
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca

  secret-scan:
    needs: toolchain
    name: Secret scan
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 0.8 min, run 44031988112.
    timeout-minutes: 5
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Go uses the default read from .tool-versions.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.toolchain.outputs.golang }}
          cache: false

      - name: Verify installed Go versions
        shell: bash
        env:
          TOOLCHAIN_GOLANG: ${{ needs.toolchain.outputs.golang }}
        run: scripts/toolchain.sh --installed golang="$TOOLCHAIN_GOLANG"

      # gitleaks pinned to its release commit for v8.30.1, verified first-hand
      # against the gitleaks/gitleaks tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database. Scans the
      # complete commit history, not just the head tree.
      - name: Run gitleaks over full history
        run: go run github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e git --config .gitleaks.toml --redact --no-banner

  spec-extraction:
    needs: toolchain
    name: Specification extraction
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 0.9 min, run 44089335225.
    timeout-minutes: 5
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install git-filter-repo
        run: |
          sudo apt-get update
          sudo apt-get install -y git-filter-repo

      # The default BEAM toolchain read from .tool-versions.
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ needs.toolchain.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ needs.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      # The submission-time extraction, tested: the two governed paths are
      # filtered out of a scratch clone, and the extracted tree must render
      # with no dangling references (the same assertions the local
      # `mix spec.extraction` gate runs on every build).
      - name: Extract the standalone specification tree
        run: |
          git clone --no-local "$GITHUB_WORKSPACE" /tmp/spec-extraction-clone
          git -C /tmp/spec-extraction-clone filter-repo --path spec/ --path priv/conformance

      - name: Verify the extracted tree renders self-contained
        run: elixir scripts/check_spec_extraction.exs --tree /tmp/spec-extraction-clone

  compatibility:
    needs: toolchain
    name: Supported toolchain — Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 3.3 min, run 44033161483.
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.toolchain.outputs.beam_lanes) }}
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ matrix.elixir }}
          TOOLCHAIN_ERLANG: ${{ matrix.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ needs.toolchain.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Build the npm kit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run tests and the conformance corpus
        run: |
          mix test
          mix conformance.verify

  quality:
    needs: toolchain
    name: Complete quality and package boundary
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 10.8 min, run 44091220164.
    timeout-minutes: 22
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ needs.toolchain.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      # The default BEAM toolchain read from .tool-versions.
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ needs.toolchain.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ needs.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      # Every landing enforces publication privacy independently of the build and tests.
      - name: Check public privacy over full history
        run: elixir scripts/check_public_privacy.exs scripts/public_privacy.json
        env:
          ABP_PUBLIC_PRIVACY_HMAC_KEY: ${{ secrets.ABP_PUBLIC_PRIVACY_HMAC_KEY }}

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Install dependencies
        run: mix deps.get --check-locked

      # The agreement gate proves the npm kit against the escript, so the
      # kit (gitignored dist/) must be built from this same tree first.
      - name: Build the npm kit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run complete quality gate
        run: mix quality
        # includes release.asset: the standalone verifier kit must run
        # green over the shipped archive's corpus on every landing

  platforms:
    needs: toolchain
    name: Consumer and contributor — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Twice the slowest green run, at least 5 min: 6.8 min, run 43998494043.
    timeout-minutes: 14
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      MIX_ENV: test
    steps:
      - name: Check out byte-exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ needs.toolchain.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Verify checkout bytes and paths
        run: node scripts/check_checkout.mjs
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ needs.toolchain.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ needs.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force
      - name: Install dependencies and compile
        run: |
          mix deps.get --check-locked
          mix compile --warnings-as-errors
      - name: Build and exercise the kit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node dist/kit/cli.mjs
          node --test test/typescript/signature_interop.mjs test/typescript/reconcile.mjs
      - name: Build and verify both consumer packages before publication
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP ([System.IO.Path]::GetRandomFileName())
          New-Item -ItemType Directory -Path $scratch | Out-Null
          try {
            $hex = Join-Path $scratch "package.tar"
            mix hex.build --output $hex
            if ($LASTEXITCODE -ne 0) { throw "Hex build failed" }
            npm pack ./dist/package --ignore-scripts --pack-destination $scratch
            if ($LASTEXITCODE -ne 0) { throw "npm pack failed" }
            $npm = @(Get-ChildItem -Path $scratch -Filter "*.tgz")
            if ($npm.Count -ne 1) { throw "Expected one npm package" }
            $tarball = $npm[0].FullName
            elixir scripts/verify_release_packages.exs --local $hex $tarball
            if ($LASTEXITCODE -ne 0) { throw "Release package verification failed" }
          } finally {
            Remove-Item -Recurse -Force $scratch
          }
      - name: Run contributor tests and both conformance adapters
        run: |
          mix test --seed 42
          mix conformance.verify
          mix conformance.product
          mix typescript.guide

  typescript-consumers:
    needs: toolchain
    name: TypeScript consumer / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Twice the slowest green run, at least 5 min: 3.0 min, run 44195292472.
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ${{ fromJSON(needs.toolchain.outputs.nodejs_lanes) }}
    steps:
      - name: Check out byte-exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ matrix.node }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Build the typed library and CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node dist/kit/cli.mjs
          node scripts/check_typescript_consumer.mjs
      - name: Exercise both conformance adapters and the harness
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ needs.toolchain.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ needs.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force
      - name: Verify the harness
        run: |
          mix deps.get --check-locked
          mix escript.build
          node scripts/check_conformance_product.mjs

  qualified:
    if: always()
    needs: [toolchain, workflow-syntax, secret-scan, spec-extraction, compatibility, quality, platforms, typescript-consumers]
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 0.1 min, run 44284713586.
    timeout-minutes: 5
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PY
