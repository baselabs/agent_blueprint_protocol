name: OIDC probe

# Temporary diagnostic (read-only): attempts an npm publish from THIS
# workflow so npm's verbose trace reveals the registry's actual OIDC
# exchange response. It cannot succeed — the trusted-publisher
# registration names publish.yml, not this file — which is exactly the
# controlled mismatch being measured. Removed after use.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Attempt publish and print the registry's exchange response
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npm publish --access public --provenance --loglevel=silly > /tmp/publish.log 2>&1 || true
          echo "publish failed as designed; registry exchange lines follow:"
          grep -iE "oidc|trusted|publisher|webauthn|token|auth|401|403|exchange" /tmp/publish.log "$HOME"/.npm/_logs/*debug-0.log 2>/dev/null | grep -v "Authorization" | tail -40
