name: OIDC probe

# Temporary diagnostic (read-only): decodes the OIDC token claims the job
# can mint for the npm audience, so they can be compared field-by-field
# against the npmjs.com trusted-publisher registration. Removed after use.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Decode the npm-audience OIDC token claims
        run: |
          set -x
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL}"
          resp="$(curl -sS --show-error -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm")"
          printf '%s' "$resp" | python3 -c '
          import json, sys, base64
          token = json.load(sys.stdin)["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in sorted(claims):
              print(f"{key}: {claims[key]}")
          '
