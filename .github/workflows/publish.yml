name: Publish

# Tag-triggered release publishing: the full quality battery runs on the
# tagged tree FIRST (a tag is not a green claim by itself); publishing
# happens only from a green battery.
#
# npm publishing uses TRUSTED PUBLISHING (GitHub OIDC): no npm token of
# any kind — the registry trusts this exact repository + workflow file,
# authenticates the run's OIDC identity, and generates the provenance
# attestation automatically. Configure once on npmjs.com (package
# Settings -> Trusted publishing, GitHub Actions: baselabs /
# agent_blueprint_protocol / publish.yml). Recommended hardening once
# configured: package Settings -> Publishing access -> require 2FA and
# disallow tokens — trusted publishing keeps working; bearer tokens
# cannot publish at all. (Direct publish via granular tokens is removed
# registry-wide January 2027; the token path is not coming back.)
#
# Every publish step is IDEMPOTENT: if the version already exists in the
# target registry (a re-run, or a release bootstrapped by a local
# publish — required for a package's very first version, since a trusted
# publisher cannot be configured before the package exists), the step
# skips loudly instead of erroring. Partial states are still resolved by
# hand: a step that reds mid-flight stops the chain. Order is fixed: npm
# kit first (it embeds the corpus), then Hex, then the GitHub release
# with the standalone verifier kit attached, then a post-publish
# verification that installs the PUBLISHED npm package from the registry
# and re-runs the agreement against the tag's escript.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged source
    # A manual dispatch resumes publishing after registry approval; it must run on
    # a release tag, never on a branch that merely carries a tag-like name.
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      ABP_PUBLIC_PRIVACY_HMAC_KEY: ${{ secrets.ABP_PUBLIC_PRIVACY_HMAC_KEY }}
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"
          install-hex: false

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Require a release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF" != refs/tags/v* || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Run publishing on a release tag"
            exit 1
          fi

      - name: Install dependencies and build the kit
        run: |
          mix deps.get
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Check final-release promotion against its candidate
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "Candidate publication: final promotion does not apply"
          else
            mapfile -t CANDIDATES < <(git tag --list "v${VERSION}-rc.*" --sort=-version:refname)
            CANDIDATE="${CANDIDATES[0]:-}"
            if [ -z "$CANDIDATE" ]; then
              echo "::error::A final release requires a candidate tag"
              exit 1
            fi
            mix release.promote --check "$CANDIDATE"
          fi

      - name: Run the complete quality battery on the tagged tree
        run: mix quality

      - name: Prepare the verified release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir verified-release
          cp spec/conformance/certified-results.json verified-release/certified-results.json
          npm pack ./dist/package --ignore-scripts --pack-destination verified-release
          env MIX_ENV=test mix release.asset --write
          mv "verifier-${VERSION}.tar.gz" verified-release/
          mix hex.build --output "verified-release/agent_blueprint_protocol-${VERSION}.tar"
          tar -czf verified-release/kit-dist.tar.gz --exclude='.DS_Store' --exclude='._*' dist agent_blueprint_protocol_conformance

      - name: Verify the packed npm artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir "$RUNNER_TEMP/packed-kit"
          tar -xzf "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" -C "$RUNNER_TEMP/packed-kit"
          diff --recursive --brief --exclude='package' --exclude='self_checks.*' --exclude='.DS_Store' --exclude='._*' dist "$RUNNER_TEMP/packed-kit/package/dist"
          node "$RUNNER_TEMP/packed-kit/package/dist/kit/cli.mjs" > "$RUNNER_TEMP/packed-report.json"
          escript agent_blueprint_protocol_conformance --corpus priv/conformance > "$RUNNER_TEMP/verified-report.json"
          cmp "$RUNNER_TEMP/packed-report.json" "$RUNNER_TEMP/verified-report.json"

      - name: Upload the verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: verified-release/
          if-no-files-found: error
          overwrite: true

  npm-publish:
    name: Stage the npm package
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      live: ${{ steps.live.outputs.live }}
    environment: GH TP for ABP
    env:
      NPM_PACKAGE: "@agent-blueprint-protocol/verifier"
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Publish the npm kit (staged trusted publishing, provenance)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "${NPM_PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "npm: ${NPM_PACKAGE}@${VERSION} already published — skipping (idempotent re-run or local bootstrap)"
          else
            # npm stage first shipped in npm 11.15. Pin the tested patch
            # independently of the runtime's bundled npm version.
            npm install -g --ignore-scripts npm@11.19.1 >/dev/null
            npm --version
            NPM_TAG=latest
            if [[ "${VERSION%%+*}" == *-* ]]; then NPM_TAG=rc; fi
            if npm stage publish "./verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" --ignore-scripts --access public --provenance --tag "$NPM_TAG" > "$RUNNER_TEMP/npm-stage.log" 2>&1; then
              cat "$RUNNER_TEMP/npm-stage.log"
            elif grep -Eq 'E409|already.*staged|cannot publish over' "$RUNNER_TEMP/npm-stage.log"; then
              echo "::notice::The version already occupies a staging slot. Its staged bytes are not verified by this run."
            else
              cat "$RUNNER_TEMP/npm-stage.log"
              exit 1
            fi
          fi

      - name: Report live or pending npm state
        id: live
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "${NPM_PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::npm version is staged, not yet approved. Hex and the GitHub release did not run."
            echo "Approve the reviewed staged package on npmjs.com, then rerun this workflow on the same tag."
          fi

  publish:
    name: Publish Hex and the release
    needs: npm-publish
    if: needs.npm-publish.outputs.live == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      NPM_PACKAGE: "@agent-blueprint-protocol/verifier"
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"
          install-hex: false

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Restore the verified kit and install Hex dependencies
        run: |
          tar -xzf verified-release/kit-dist.tar.gz
          mix deps.get

      - name: Confirm the rebuilt Hex package matches the verified artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mix hex.build --output rebuilt.tar
          cmp rebuilt.tar "verified-release/agent_blueprint_protocol-${VERSION}.tar"

      - name: Verify the live npm version before further publication
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm view "${NPM_PACKAGE}@${VERSION}" version >/dev/null
          LIVE_INTEGRITY=$(npm view "${NPM_PACKAGE}@${VERSION}" dist.integrity)
          VERIFIED_INTEGRITY=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {createHash} from "node:crypto"; process.stdout.write("sha512-" + createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"));' "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz")
          if [ "$LIVE_INTEGRITY" != "$VERIFIED_INTEGRITY" ]; then
            echo "::error::Live npm bytes differ from the verified archive"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/postpublish"
          cd "$RUNNER_TEMP/postpublish"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "${NPM_PACKAGE}@${VERSION}"
          npx --no-install verifier > "$RUNNER_TEMP/kit-report.json"
          cd "$GITHUB_WORKSPACE"
          escript agent_blueprint_protocol_conformance --corpus priv/conformance > "$RUNNER_TEMP/escript-report.json"
          cmp "$RUNNER_TEMP/kit-report.json" "$RUNNER_TEMP/escript-report.json"

      - name: Publish the Hex package and docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "::error::HEX_API_KEY absent; further publication stopped"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          curl --fail --silent --show-error "https://hex.pm/api/packages/agent_blueprint_protocol" > "$RUNNER_TEMP/hex-package.json"
          HEX_LIVE=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const pkg=JSON.parse(readFileSync(process.argv[1])); if(!Array.isArray(pkg.releases))throw Error("Invalid Hex release list"); process.stdout.write(pkg.releases.some(release=>release.version===process.argv[2])?"true":"false");' "$RUNNER_TEMP/hex-package.json" "$VERSION")
          if [ "$HEX_LIVE" = true ]; then
            echo "hex: already live; verifying its bytes before the GitHub release"
          else
            # Hex 2.7.0 prints API validation errors as field: message.
            # https://github.com/hexpm/hex/blob/v2.7.0/lib/hex/utils.ex#L216-L248
            # https://github.com/hexpm/hexpm/blob/7fcc788cde63fe0a1d3e3cd1ec58372d8c17bfbe/lib/hexpm/repository/staged_releases.ex#L129
            if mix hex.publish --yes > "$RUNNER_TEMP/hex-publish.log" 2>&1; then
              cat "$RUNNER_TEMP/hex-publish.log"
            elif grep -Fxq 'version: is awaiting approval' "$RUNNER_TEMP/hex-publish.log"; then
              echo "hex: already staged; the public release check still gates publication"
            else
              cat "$RUNNER_TEMP/hex-publish.log"
              exit 1
            fi
          fi

      - name: Report live or pending Hex state
        id: hex-live
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/check_hex_release.mjs "$VERSION" "verified-release/agent_blueprint_protocol-${VERSION}.tar"

      - name: Attach the verifier kit to the GitHub release
        if: steps.hex-live.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — leaving it as-is (idempotent)"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE_ARGS=()
          if [[ "${VERSION%%+*}" == *-* ]]; then PRERELEASE_ARGS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "verified-release/verifier-${VERSION}.tar.gz" "verified-release/certified-results.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${VERSION} — installable verifier" \
            --generate-notes "${PRERELEASE_ARGS[@]}"
