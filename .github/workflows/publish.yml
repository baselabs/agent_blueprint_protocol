name: Publish

# Owner-dispatched from the default branch with one required release_commit SHA.
# Require its default-branch ancestry and successful qualified check before building.
# Refuse unknown package names and an existing remote tag. Redispatch the same
# release_commit to finish a held release, uploading only what is missing.
# npm uses trusted publishing with provenance in environment publish; no npm token.
# HEX_API_KEY lives there and reaches only the no-project upload step.
# No workflow creates a release or tag. release-assets is handed to maintainers, who
# read the packages back, tag the published docs commit, create the GitHub release, and dispatch Pages.

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full 40-hex lowercase SHA of the qualified release commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the qualified release source
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 8.6 min, run 44033341768.
    timeout-minutes: 18
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.inputs.outputs.version }}
      npm: ${{ steps.npm.outputs.npm }}
      hex_package: ${{ steps.hex.outputs.package }}
      hex_docs: ${{ steps.hex.outputs.docs }}
      hex_checksum: ${{ steps.hex.outputs.checksum }}
      nodejs: ${{ steps.versions.outputs.nodejs }}
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Validate the release commit
        id: release
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_commit must be a full 40-hex lowercase SHA"
            exit 1
          fi
          printf 'commit=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require default-branch ancestry
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::release_commit must be reachable from the default branch"
            exit 1
          fi

      - name: Require successful qualification of the release commit
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request
          commit = os.environ["RELEASE_COMMIT"]
          api = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          page = 1
          try:
              while True:
                  request = urllib.request.Request(
                      f"{api}/repos/{repository}/commits/{commit}/check-runs?check_name=qualified&filter=all&per_page=100&page={page}",
                      headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                               "Accept": "application/vnd.github+json",
                               "X-GitHub-Api-Version": "2022-11-28"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      checks = json.load(response)["check_runs"]
                  if any(check.get("name") == "qualified"
                         and check.get("head_sha") == commit
                         and check.get("conclusion") == "success" for check in checks):
                      break
                  if len(checks) < 100:
                      raise SystemExit("::error::release_commit has no successful qualified check")
                  page += 1
          except Exception:
              raise SystemExit("::error::Could not read release commit qualification") from None
          PYTHON

      - name: Read the default toolchain
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ steps.versions.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ steps.versions.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Read and compare the source package versions
        id: inputs
        run: |
          VERSION=$(node scripts/release_artifact_info.mjs version)
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse missing package names or an existing release tag
        run: bash scripts/check_publication.sh

      - name: Check public privacy over full history
        run: elixir scripts/check_public_privacy.exs scripts/public_privacy.json
        env:
          ABP_PUBLIC_PRIVACY_HMAC_KEY: ${{ secrets.ABP_PUBLIC_PRIVACY_HMAC_KEY }}

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Install dependencies and build the kit
        run: |
          mix deps.get --check-locked
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Check final-release promotion against its candidate
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "Candidate publication: final promotion does not apply"
          else
            mapfile -t CANDIDATES < <(git tag --list "v${VERSION}-rc.*" --sort=-version:refname)
            CANDIDATE="${CANDIDATES[0]:-}"
            if [ -z "$CANDIDATE" ]; then
              echo "::error::A final release requires a candidate tag"
              exit 1
            fi
            mix release.promote --check "$CANDIDATE"
          fi

      - name: Run the complete quality battery on the release commit
        run: mix quality

      - name: Prepare the verified release artifacts
        run: |
          mkdir verified-release
          cp spec/conformance/certified-results.json verified-release/certified-results.json
          npm pack ./dist/package --ignore-scripts --pack-destination verified-release
          env MIX_ENV=test mix release.asset --write
          mv "verifier-${VERSION}.tar.gz" verified-release/
          mix hex.build --output "verified-release/agent_blueprint_protocol-${VERSION}.tar"
          tar -czf verified-release/kit-dist.tar.gz \
            --exclude='.DS_Store' --exclude='._*' dist agent_blueprint_protocol_conformance

      - name: Verify the packed npm artifact
        run: |
          mkdir "$RUNNER_TEMP/packed-kit"
          tar -xzf "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" \
            -C "$RUNNER_TEMP/packed-kit"
          diff --recursive --brief --exclude='package' --exclude='self_checks.*' \
            --exclude='.DS_Store' --exclude='._*' dist "$RUNNER_TEMP/packed-kit/package/dist"
          node "$RUNNER_TEMP/packed-kit/package/dist/kit/cli.mjs" \
            > "$RUNNER_TEMP/packed-report.json"
          escript agent_blueprint_protocol_conformance --corpus priv/conformance \
            > "$RUNNER_TEMP/verified-report.json"
          cmp "$RUNNER_TEMP/packed-report.json" "$RUNNER_TEMP/verified-report.json"

      - name: Verify both built release packages
        run: |
          elixir scripts/verify_release_packages.exs --local \
            "verified-release/agent_blueprint_protocol-${VERSION}.tar" \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" \
            --write-manifest verified-release/release-manifest.json

      - name: Refuse a package whose changelog is not stamped for its version
        shell: bash
        run: |
          python3 -I - "verified-release/agent_blueprint_protocol-${VERSION}.tar" "$VERSION" <<'PY'
          import io, re, sys, tarfile
          archive, version = sys.argv[1], sys.argv[2]
          def refuse(message):
              raise SystemExit(f'{archive}: {message}; publication refused')
          with tarfile.open(archive, 'r:*') as outer:
              if 'contents.tar.gz' in outer.getnames():
                  package = tarfile.open(fileobj=io.BytesIO(outer.extractfile('contents.tar.gz').read()), mode='r:gz')
                  root = ''
              else:
                  package, root = outer, 'package/'
              found = [member for member in package.getmembers() if member.isfile()
                       and re.fullmatch(re.escape(root) + r'(?i:changelog(?:\.md|\.markdown|\.txt)?)', member.name)]
              if len(found) != 1:
                  refuse('the package must ship exactly one root CHANGELOG')
              try:
                  lines = package.extractfile(found[0]).read().decode('utf-8').splitlines()
              except UnicodeDecodeError:
                  refuse('the packaged CHANGELOG is not UTF-8')
          headings, fence = {}, False
          for index, line in enumerate(lines):
              if re.match(r' {0,3}(```|~~~)', line):
                  fence = not fence
              elif not fence and (match := re.match(r' {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$', line)):
                  headings[index] = (len(match.group(1)), match.group(2) or '')
          token = re.compile(r'(?<![0-9A-Za-z.+-])v?' + re.escape(version) + r'(?![0-9A-Za-z.+-])')
          stamped = [index for index, (_, title) in headings.items() if token.search(title)]
          if not stamped:
              refuse(f'the packaged CHANGELOG has no section for {version}')
          at, level = stamped[0], headings[stamped[0]][0]
          def written(start):
              end = next((index for index, (depth, _) in headings.items() if index > start and depth <= level), len(lines))
              return any(line.strip() for index, line in enumerate(lines[start + 1:end], start + 1) if index not in headings)
          if not written(at):
              refuse(f'the packaged CHANGELOG section for {version} is empty')
          for start, (depth, title) in headings.items():
              if start < at and depth == level and written(start):
                  refuse(f'the packaged CHANGELOG has entries above {version}, under "{title}"')
          print(f'{archive}: the packaged CHANGELOG is stamped for {version}')
          PY

      - name: Refuse a package whose changelog is not stamped for its version
        shell: bash
        run: |
          python3 -I - "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" "$VERSION" <<'PY'
          import io, re, sys, tarfile
          archive, version = sys.argv[1], sys.argv[2]
          def refuse(message):
              raise SystemExit(f'{archive}: {message}; publication refused')
          with tarfile.open(archive, 'r:*') as outer:
              if 'contents.tar.gz' in outer.getnames():
                  package = tarfile.open(fileobj=io.BytesIO(outer.extractfile('contents.tar.gz').read()), mode='r:gz')
                  root = ''
              else:
                  package, root = outer, 'package/'
              found = [member for member in package.getmembers() if member.isfile()
                       and re.fullmatch(re.escape(root) + r'(?i:changelog(?:\.md|\.markdown|\.txt)?)', member.name)]
              if len(found) != 1:
                  refuse('the package must ship exactly one root CHANGELOG')
              try:
                  lines = package.extractfile(found[0]).read().decode('utf-8').splitlines()
              except UnicodeDecodeError:
                  refuse('the packaged CHANGELOG is not UTF-8')
          headings, fence = {}, False
          for index, line in enumerate(lines):
              if re.match(r' {0,3}(```|~~~)', line):
                  fence = not fence
              elif not fence and (match := re.match(r' {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$', line)):
                  headings[index] = (len(match.group(1)), match.group(2) or '')
          token = re.compile(r'(?<![0-9A-Za-z.+-])v?' + re.escape(version) + r'(?![0-9A-Za-z.+-])')
          stamped = [index for index, (_, title) in headings.items() if token.search(title)]
          if not stamped:
              refuse(f'the packaged CHANGELOG has no section for {version}')
          at, level = stamped[0], headings[stamped[0]][0]
          def written(start):
              end = next((index for index, (depth, _) in headings.items() if index > start and depth <= level), len(lines))
              return any(line.strip() for index, line in enumerate(lines[start + 1:end], start + 1) if index not in headings)
          if not written(at):
              refuse(f'the packaged CHANGELOG section for {version} is empty')
          for start, (depth, title) in headings.items():
              if start < at and depth == level and written(start):
                  refuse(f'the packaged CHANGELOG has entries above {version}, under "{title}"')
          print(f'{archive}: the packaged CHANGELOG is stamped for {version}')
          PY

      - name: Prepare the verified documentation archive
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          release = {"package": "agent_blueprint_protocol", "version": os.environ["VERSION"], "commit": os.environ["RELEASE_COMMIT"]}
          Path("doc/release.json").write_text(json.dumps(release, separators=(",", ":")) + "\n", encoding="utf-8")
          PYTHON
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$RELEASE_COMMIT")
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -cf - -C doc . | gzip -n > verified-release/hex-docs.tar.gz
          (cd verified-release && mix run --no-mix-exs ../scripts/hex_release_state.exs docs-provenance \
            agent_blueprint_protocol "$VERSION" hex-docs.tar.gz "$RELEASE_COMMIT" "$GITHUB_WORKSPACE")
          echo "Docs checksum: $(sha256sum verified-release/hex-docs.tar.gz | cut -d' ' -f1)"

      - name: Plan the npm upload
        id: npm
        run: |
          node scripts/npm_release_state.mjs plan "$VERSION" \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz"

      - name: Check out the workflow's Hex tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: workflow-tools
          persist-credentials: false
          sparse-checkout: |
            /scripts/hex_release_state.exs
            /scripts/gate_command.exs
          sparse-checkout-cone-mode: false

      - name: Plan the Hex uploads
        id: hex
        working-directory: verified-release
        run: |
          mix run --no-mix-exs ../workflow-tools/scripts/hex_release_state.exs plan \
            agent_blueprint_protocol "$VERSION" "agent_blueprint_protocol-${VERSION}.tar"
          if ! grep -Eq '^checksum=[0-9a-f]{64}$' "$GITHUB_OUTPUT"; then
            echo "::error::The workflow's Hex planner did not emit the package checksum. Check the planner before dispatching Publish again."
            exit 1
          fi

      - name: Refuse inconsistent registry state
        env:
          NPM_STATE: ${{ steps.npm.outputs.npm }}
          HEX_PACKAGE: ${{ steps.hex.outputs.package }}
          HEX_DOCS: ${{ steps.hex.outputs.docs }}
        run: |
          if [ "$NPM_STATE" = upload ] && { [ "$HEX_PACKAGE" = served ] || [ "$HEX_DOCS" = served ]; }; then
            echo "::error::Hex is served while npm is absent; inconsistent registry state"
            exit 1
          fi

      - name: Prepare consumer release assets
        run: |
          mkdir verified-release/release-assets
          cp "verified-release/agent_blueprint_protocol-${VERSION}.tar" \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" \
            "verified-release/verifier-${VERSION}.tar.gz" \
            verified-release/certified-results.json verified-release/release-manifest.json \
            verified-release/release-assets/
          elixir scripts/release_notes.exs "$VERSION" verified-release/release-assets/release-notes.md
          (cd verified-release/release-assets && sha256sum -- * > SHA256SUMS)

      - name: Upload the verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: verified-release/
          if-no-files-found: error
          retention-days: 1

  npm-publish:
    name: Stage the npm package
    needs: verify
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 0.3 min, run 44033341768.
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      NPM_PACKAGE: "@agent-blueprint-protocol/verifier"
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out the workflow's toolchain reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: workflow-tools
          persist-credentials: false
          sparse-checkout: /scripts/toolchain.sh
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.verify.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ needs.verify.outputs.nodejs }}
        run: workflow-tools/scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Publish the npm kit (staged trusted publishing, provenance)
        if: needs.verify.outputs.npm == 'upload'
        run: |
          npm install -g --ignore-scripts npm@11.19.1 >/dev/null
          npm --version
          NPM_TAG=latest
          if [[ "${VERSION%%+*}" == *-* ]]; then NPM_TAG=rc; fi
          if ! npm stage publish \
            "./verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" \
            --ignore-scripts --access public --provenance --tag "$NPM_TAG"; then
            # npm logs why trusted publishing gave it no credential only in its
            # debug log; print those lines (messages, never the token).
            grep -ih 'oidc' "$HOME"/.npm/_logs/*-debug-0.log || echo "npm debug log has no OIDC lines"
            echo "::error::npm upload failed or staging slot occupied; approve staged bytes on npmjs.com if held, then dispatch Publish again with the same release_commit; the next run uploads only what is missing."
            exit 1
          fi

  npm-kit:
    name: Check the published npm kit
    needs: [verify, npm-publish]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # Split out of hex-publish; that whole job, including this check, bounds it.
    # Twice the slowest green run, at least 5 min: 1.1 min, run 44085034568.
    timeout-minutes: 5
    env:
      NPM_PACKAGE: "@agent-blueprint-protocol/verifier"
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_commit }}
          persist-credentials: false

      - name: Read the default toolchain
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ steps.versions.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ steps.versions.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Read back the served npm version
        run: |
          node scripts/npm_release_state.mjs read-back "$VERSION" \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz"

      - name: Restore the verified kit
        run: tar -xzf verified-release/kit-dist.tar.gz

      - name: Verify the live npm version and the installed kit
        run: |
          LIVE_INTEGRITY=$(npm view "${NPM_PACKAGE}@${VERSION}" dist.integrity)
          VERIFIED_INTEGRITY=$(node scripts/release_artifact_info.mjs npm-integrity \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz")
          if [ "$LIVE_INTEGRITY" != "$VERIFIED_INTEGRITY" ]; then
            echo "::error::Live npm bytes differ from the verified archive; publication refused"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/published-kit"
          cd "$RUNNER_TEMP/published-kit"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "${NPM_PACKAGE}@${VERSION}"
          npx --no-install verifier > "$RUNNER_TEMP/kit-report.json"
          cd "$GITHUB_WORKSPACE"
          escript agent_blueprint_protocol_conformance --corpus priv/conformance \
            > "$RUNNER_TEMP/escript-report.json"
          cmp "$RUNNER_TEMP/kit-report.json" "$RUNNER_TEMP/escript-report.json"

  hex-publish:
    name: Publish Hex and docs
    needs: [verify, npm-kit]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 1.1 min, run 44085034568.
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out the workflow's Hex tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: workflow-tools
          persist-credentials: false
          sparse-checkout: |
            /scripts/publish_hex_artifacts.exs
            /scripts/toolchain.sh
          sparse-checkout-cone-mode: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.verify.outputs.elixir }}
          otp-version: ${{ needs.verify.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ needs.verify.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ needs.verify.outputs.otp }}
        run: workflow-tools/scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Publish the verified Hex archive and docs to public hexpm
        if: needs.verify.outputs.hex_package == 'upload' || needs.verify.outputs.hex_docs == 'upload'
        working-directory: workflow-tools
        env:
          HEX_PACKAGE: ${{ needs.verify.outputs.hex_package }}
          HEX_DOCS: ${{ needs.verify.outputs.hex_docs }}
          HEX_CHECKSUM: ${{ needs.verify.outputs.hex_checksum }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          set -- agent_blueprint_protocol "$VERSION" --checksum "$HEX_CHECKSUM"
          if [ "$HEX_PACKAGE" = upload ]; then set -- "$@" --package "../verified-release/agent_blueprint_protocol-${VERSION}.tar"; fi
          if [ "$HEX_DOCS" = upload ]; then set -- "$@" --docs ../verified-release/hex-docs.tar.gz; fi
          mix run --no-mix-exs scripts/publish_hex_artifacts.exs "$@"

  hex-read-back:
    name: Read back Hex and assemble release assets
    needs: [verify, hex-publish]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    # The former combined Hex job, including read-back, bounds this job.
    # Twice the slowest green run, at least 5 min: 1.1 min, run 44085034568.
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_commit }}
          persist-credentials: false
          fetch-depth: 0

      - name: Read the default toolchain
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ steps.versions.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ steps.versions.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Read back the served Hex package and docs
        working-directory: verified-release
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
        run: |
          mix run --no-mix-exs ../scripts/hex_release_state.exs read-back \
            agent_blueprint_protocol "$VERSION" "agent_blueprint_protocol-${VERSION}.tar" \
            "release-assets/hex-docs-${VERSION}.tar.gz" "$RELEASE_COMMIT" "$GITHUB_WORKSPACE"
          (cd release-assets && sha256sum -- "hex-docs-${VERSION}.tar.gz" >> SHA256SUMS)

      - name: Hand consumer release assets to maintainers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: verified-release/release-assets/
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: [verify, hex-read-back]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    permissions:
      contents: read
    name: Published kit — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Measured as this repository's postpublish.yml smoke job.
    # Twice the slowest green run, at least 5 min: 0.5 min, run 44085034568.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Refuse refs outside the default branch
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out smoke script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_commit }}
          persist-credentials: false
      - name: Read the default toolchain
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Install the published package and verify its corpus
        env:
          ABP_VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/postpublish_smoke.mjs "$env:ABP_VERSION"
        shell: pwsh

  livebooks:
    needs: [verify, hex-read-back]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    permissions:
      contents: read
    name: Published consumer examples - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Measured as this repository's postpublish.yml livebooks job.
    # Twice the slowest green run, at least 5 min: 2.9 min, run 44022461020.
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Refuse refs outside the default branch
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      # Publish uses the qualified release_commit.
      # Full history supplies the earlier censuses and signed 0.8.x goldens.
      - name: Check out the consumer driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Read the default toolchain
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ steps.versions.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ steps.versions.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force
        shell: pwsh
      - name: Verify the published packages and replay release history through them
        env:
          ABP_VERSION: ${{ needs.verify.outputs.version }}
        # Every consumer gate and example document is loaded from the
        # checksum-verified published packages. The checkout supplies only
        # transport, extraction, and the release tags the installed replay reads.
        run: elixir scripts/verify_release_packages.exs --registry "$env:ABP_VERSION"
        shell: pwsh
