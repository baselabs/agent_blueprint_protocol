name: Publish

# Maintainer-dispatched publication from the default branch, without inputs.
# The DevOps owner must repoint npmjs.com's trusted publisher to this repository,
# publish.yml, and environment publish (formerly GH TP for ABP). No npm token.
# Protect publish for the two owners and the default branch; store HEX_API_KEY
# there. The privacy guard's HMAC remains a step-scoped repository secret.
# Refuse occupied npm/Hex versions or a remote version tag before publishing.
# Partial or pending publication requires manual recovery with this run's exact
# artifacts; redispatch is not a resume operation. Never create or push a tag.
# npm, then Hex, then a GitHub DRAFT with the verifier and certified results.
# The owner reads packages back, pushes v<version> at this run's SHA, then
# publishes the draft. Historical replay needs earlier tags, not the new tag.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the dispatched source
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the default toolchain and package version
        id: inputs
        run: python scripts/read_release_inputs.py

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.inputs.outputs.node }}
          package-manager-cache: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.inputs.outputs.elixir }}
          otp-version: ${{ steps.inputs.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Refuse an occupied release version
        run: bash scripts/check_publication.sh

      - name: Check public privacy over full history
        run: elixir scripts/check_public_privacy.exs scripts/public_privacy.json
        env:
          ABP_PUBLIC_PRIVACY_HMAC_KEY: ${{ secrets.ABP_PUBLIC_PRIVACY_HMAC_KEY }}

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Install dependencies and build the kit
        run: |
          mix deps.get --check-locked
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Check final-release promotion against its candidate
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "Candidate publication: final promotion does not apply"
          else
            mapfile -t CANDIDATES < <(git tag --list "v${VERSION}-rc.*" --sort=-version:refname)
            CANDIDATE="${CANDIDATES[0]:-}"
            if [ -z "$CANDIDATE" ]; then
              echo "::error::A final release requires a candidate tag"
              exit 1
            fi
            mix release.promote --check "$CANDIDATE"
          fi

      - name: Run the complete quality battery on the dispatched source
        run: mix quality

      - name: Prepare the verified release artifacts
        run: |
          mkdir verified-release
          cp spec/conformance/certified-results.json verified-release/certified-results.json
          npm pack ./dist/package --ignore-scripts --pack-destination verified-release
          env MIX_ENV=test mix release.asset --write
          mv "verifier-${VERSION}.tar.gz" verified-release/
          mix hex.build --output "verified-release/agent_blueprint_protocol-${VERSION}.tar"
          tar -czf verified-release/kit-dist.tar.gz \
            --exclude='.DS_Store' --exclude='._*' dist agent_blueprint_protocol_conformance

      - name: Verify the packed npm artifact
        run: |
          mkdir "$RUNNER_TEMP/packed-kit"
          tar -xzf "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" \
            -C "$RUNNER_TEMP/packed-kit"
          diff --recursive --brief --exclude='package' --exclude='self_checks.*' \
            --exclude='.DS_Store' --exclude='._*' dist "$RUNNER_TEMP/packed-kit/package/dist"
          node "$RUNNER_TEMP/packed-kit/package/dist/kit/cli.mjs" \
            > "$RUNNER_TEMP/packed-report.json"
          escript agent_blueprint_protocol_conformance --corpus priv/conformance \
            > "$RUNNER_TEMP/verified-report.json"
          cmp "$RUNNER_TEMP/packed-report.json" "$RUNNER_TEMP/verified-report.json"

      - name: Verify both built release packages
        run: |
          elixir scripts/verify_release_packages.exs --local \
            "verified-release/agent_blueprint_protocol-${VERSION}.tar" \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz"

      - name: Prepare the verified documentation archive
        run: tar -czf verified-release/hex-docs.tar.gz -C doc .

      - name: Upload the verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: verified-release/
          if-no-files-found: error

  npm-publish:
    name: Stage the npm package
    needs: verify
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      NPM_PACKAGE: "@agent-blueprint-protocol/verifier"
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the default toolchain and package version
        id: inputs
        run: python scripts/read_release_inputs.py

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.inputs.outputs.node }}
          package-manager-cache: false

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Refuse an occupied release version again before publishing
        run: bash scripts/check_publication.sh

      - name: Publish the npm kit (staged trusted publishing, provenance)
        run: |
          npm install -g --ignore-scripts npm@11.19.1 >/dev/null
          npm --version
          NPM_TAG=latest
          if [[ "${VERSION%%+*}" == *-* ]]; then NPM_TAG=rc; fi
          if ! npm stage publish \
            "./verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" \
            --ignore-scripts --access public --provenance --tag "$NPM_TAG"; then
            echo "::error::npm upload failed or staging slot occupied; manual recovery required"
            exit 1
          fi

      - name: Require the npm version to be live
        run: |
          if ! npm view "${NPM_PACKAGE}@${VERSION}" version >/dev/null; then
            echo "::error::npm is pending or unreadable. Hex and the draft did not run."
            echo "Approve staged bytes and recover by hand using this run's verified artifacts."
            echo "Do not redispatch: an occupied version is refused."
            exit 1
          fi

  hex-publish:
    name: Publish Hex and docs
    needs: npm-publish
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NPM_PACKAGE: "@agent-blueprint-protocol/verifier"
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the default toolchain and package version
        id: inputs
        run: python scripts/read_release_inputs.py

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.inputs.outputs.node }}
          package-manager-cache: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.inputs.outputs.elixir }}
          otp-version: ${{ steps.inputs.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Restore the verified kit
        run: tar -xzf verified-release/kit-dist.tar.gz

      - name: Verify the live npm version before further publication
        run: |
          LIVE_INTEGRITY=$(npm view "${NPM_PACKAGE}@${VERSION}" dist.integrity)
          VERIFIED_INTEGRITY=$(node scripts/release_artifact_info.mjs npm-integrity \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz")
          if [ "$LIVE_INTEGRITY" != "$VERIFIED_INTEGRITY" ]; then
            echo "::error::Live npm bytes differ from the verified archive; recover by hand"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/postpublish"
          cd "$RUNNER_TEMP/postpublish"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "${NPM_PACKAGE}@${VERSION}"
          npx --no-install verifier > "$RUNNER_TEMP/kit-report.json"
          cd "$GITHUB_WORKSPACE"
          escript agent_blueprint_protocol_conformance --corpus priv/conformance \
            > "$RUNNER_TEMP/escript-report.json"
          cmp "$RUNNER_TEMP/kit-report.json" "$RUNNER_TEMP/escript-report.json"

      - name: Refuse occupied Hex or tag state before publishing
        run: bash scripts/check_publication.sh --after-npm

      - name: Publish the verified Hex archive and docs to public hexpm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mix run --no-mix-exs scripts/publish_hex_artifacts.exs \
            "$VERSION" "verified-release/agent_blueprint_protocol-${VERSION}.tar" \
            verified-release/hex-docs.tar.gz

      - name: Require the Hex version to be live with the verified bytes
        run: |
          node scripts/check_hex_release.mjs "$VERSION" \
            "verified-release/agent_blueprint_protocol-${VERSION}.tar"

  draft-release:
    name: Draft the GitHub release without creating a tag
    needs: hex-publish
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the default toolchain and package version
        id: inputs
        run: python scripts/read_release_inputs.py

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Attach the verifier kit to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/v${VERSION}")
          if [ -n "$REMOTE_TAG" ]; then
            echo "::error::Release tag already exists; manual recovery required"
            exit 1
          fi
          PRERELEASE_ARGS=()
          if [[ "${VERSION%%+*}" == *-* ]]; then PRERELEASE_ARGS+=(--prerelease); fi
          gh release create "v${VERSION}" \
            "verified-release/verifier-${VERSION}.tar.gz" \
            "verified-release/certified-results.json" \
            --repo "$GITHUB_REPOSITORY" --draft --target "$RELEASE_SHA" \
            --title "v${VERSION}" --generate-notes "${PRERELEASE_ARGS[@]}"
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/v${VERSION}")
          if [ -n "$REMOTE_TAG" ]; then
            echo "::error::Unexpected release tag after drafting; owner investigation required"
            exit 1
          fi

  # Installed replay reads historical tags; the new version's tag is not needed.
  postpublish:
    name: Verify the published release
    needs: [verify, draft-release]
    permissions:
      contents: read
    uses: ./.github/workflows/postpublish.yml
    with:
      version: ${{ needs.verify.outputs.version }}
