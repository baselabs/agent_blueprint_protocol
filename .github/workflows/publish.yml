name: Publish

# Tag-triggered release publishing: the full quality battery runs on the
# tagged tree FIRST (a tag is not a green claim by itself); publishing
# happens only from a green battery.
#
# npm publishing uses TRUSTED PUBLISHING (GitHub OIDC): no npm token of
# any kind — the registry trusts this exact repository + workflow file,
# authenticates the run's OIDC identity, and generates the provenance
# attestation automatically. Configure once on npmjs.com (package
# Settings -> Trusted publishing, GitHub Actions: baselabs /
# agent_blueprint_protocol / publish.yml). Recommended hardening once
# configured: package Settings -> Publishing access -> require 2FA and
# disallow tokens — trusted publishing keeps working; bearer tokens
# cannot publish at all. (Direct publish via granular tokens is removed
# registry-wide January 2027; the token path is not coming back.)
#
# Hex still publishes with HEX_API_KEY; with it absent the run SKIPS
# publishing loudly after the battery (never a partial publish, never a
# red run that merely means unconfigured). A MID-FLIGHT failure (a step
# reds after another published) stops the chain — re-running reds on
# the already-published step; that is deliberate: partial states are
# resolved by hand, never papered over. Order is fixed: npm kit first
# (it embeds the corpus), then Hex, then the GitHub release with the
# standalone verifier kit attached, then a post-publish verification that
# installs the PUBLISHED npm package from the registry and re-runs the
# agreement against the tag's escript.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Battery, then publish (npm + Hex + release)
    runs-on: ubuntu-24.04
    env:
      ABP_PUBLIC_PRIVACY_HMAC_KEY: ${{ secrets.ABP_PUBLIC_PRIVACY_HMAC_KEY }}
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.3"

      # Preflight: publishing needs HEX_API_KEY (npm needs NO token —
      # trusted publishing authenticates via this run's OIDC identity).
      # With the key absent the workflow says so LOUDLY and skips
      # publishing after the battery — never a partial publish, never a
      # red run that merely means "not configured". npm-side trust is not
      # probeable from the repo: if the Trusted Publisher is not yet
      # configured, npm publish itself fails with the registry's own
      # explicit untrusted-publisher error.
      - name: Publishing preflight
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "::warning::CI publish not configured: HEX_API_KEY missing."
            echo "publishing: SKIPPED (secret absent) — the battery below still runs"
            echo "PUBLISH_ENABLED=false" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies and build the kit
        run: |
          mix deps.get
          npm install --no-audit --no-fund
          npm run build

      - name: Run the complete quality battery on the tagged tree
        run: mix quality

      # Trusted publishing: no NODE_AUTH_TOKEN — npm exchanges this run's
      # GitHub OIDC identity (id-token: write above) for a short-lived
      # publish token; provenance is generated automatically.
      - name: Publish the npm kit (trusted publishing, provenance)
        if: env.PUBLISH_ENABLED == 'true'
        run: npm publish --access public --provenance

      - name: Publish the Hex package and docs
        if: env.PUBLISH_ENABLED == 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: yes | mix hex.publish

      - name: Attach the verifier kit to the GitHub release
        if: env.PUBLISH_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export MIX_ENV=test
          mix release.asset --write
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "verifier-${VERSION}.tar.gz" \
            --title "${GITHUB_REF_NAME#v} — installable verifier" \
            --generate-notes

      - name: Post-publish verification (registry install vs the tag)
        if: always() && env.PUBLISH_ENABLED == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir /tmp/postpublish
          cd /tmp/postpublish
          npm init -y > /dev/null
          npm install --no-audit --no-fund "@rjpalermo/agent-blueprint-protocol@${VERSION}"
          npx agent-blueprint-protocol > /tmp/kit-report.json
          cd "$GITHUB_WORKSPACE"
          mix escript.build
          ./agent_blueprint_protocol_conformance --corpus priv/conformance > /tmp/escript-report.json
          cmp /tmp/kit-report.json /tmp/escript-report.json
