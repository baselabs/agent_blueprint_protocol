name: Publish

# Tag-triggered release publishing: the full quality battery runs on the
# tagged tree FIRST (a tag is not a green claim by itself); publishing
# happens only from a green battery.
#
# npm publishing uses TRUSTED PUBLISHING (GitHub OIDC): no npm token of
# any kind — the registry trusts this exact repository + workflow file,
# authenticates the run's OIDC identity, and generates the provenance
# attestation automatically. Configure once on npmjs.com (package
# Settings -> Trusted publishing, GitHub Actions: baselabs /
# agent_blueprint_protocol / publish.yml). Recommended hardening once
# configured: package Settings -> Publishing access -> require 2FA and
# disallow tokens — trusted publishing keeps working; bearer tokens
# cannot publish at all. (Direct publish via granular tokens is removed
# registry-wide January 2027; the token path is not coming back.)
#
# Every publish step is IDEMPOTENT: if the version already exists in the
# target registry (a re-run, or a release bootstrapped by a local
# publish — required for a package's very first version, since a trusted
# publisher cannot be configured before the package exists), the step
# skips loudly instead of erroring. Partial states are still resolved by
# hand: a step that reds mid-flight stops the chain. Order is fixed: npm
# kit first (it embeds the corpus), then Hex, then the GitHub release
# with the standalone verifier kit attached, then a post-publish
# verification that installs the PUBLISHED npm package from the registry
# and re-runs the agreement against the tag's escript.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged source
    runs-on: ubuntu-24.04
    env:
      ABP_PUBLIC_PRIVACY_HMAC_KEY: ${{ secrets.ABP_PUBLIC_PRIVACY_HMAC_KEY }}
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"

      - name: Install dependencies and build the kit
        run: |
          mix deps.get
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run the complete quality battery on the tagged tree
        run: mix quality

      - name: Prepare the verified release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir verified-release
          npm pack --ignore-scripts --pack-destination verified-release
          env MIX_ENV=test mix release.asset --write
          mv "verifier-${VERSION}.tar.gz" verified-release/
          mix hex.build --output "verified-release/agent_blueprint_protocol-${VERSION}.tar"
          tar -czf verified-release/kit-dist.tar.gz --exclude='.DS_Store' --exclude='._*' dist agent_blueprint_protocol_conformance

      - name: Verify the packed npm artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir "$RUNNER_TEMP/packed-kit"
          tar -xzf "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" -C "$RUNNER_TEMP/packed-kit"
          diff --recursive --brief --exclude='self_checks.*' --exclude='.DS_Store' --exclude='._*' dist "$RUNNER_TEMP/packed-kit/package/dist"
          node "$RUNNER_TEMP/packed-kit/package/dist/kit/cli.mjs" > "$RUNNER_TEMP/packed-report.json"
          ./agent_blueprint_protocol_conformance --corpus priv/conformance > "$RUNNER_TEMP/verified-report.json"
          cmp "$RUNNER_TEMP/packed-report.json" "$RUNNER_TEMP/verified-report.json"

      - name: Upload the verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: verified-release/
          if-no-files-found: error

  npm-publish:
    name: Stage the npm package
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: GH TP for ABP
    env:
      NPM_PACKAGE: "@agent-blueprint-protocol/verifier"
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Publish the npm kit (staged trusted publishing, provenance)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "${NPM_PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "npm: ${NPM_PACKAGE}@${VERSION} already published — skipping (idempotent re-run or local bootstrap)"
          else
            # npm stage publish ships with npm 11.19; the Node-bundled npm
            # is older and knows no staging, which turns every attempt into
            # a forbidden direct publish (403, action not permitted).
            npm install -g --ignore-scripts npm@11.19.1 >/dev/null
            npm --version
            npm stage publish "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" --ignore-scripts --access public --provenance
          fi

  publish:
    name: Publish Hex and the release
    needs: npm-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      NPM_PACKAGE: "@agent-blueprint-protocol/verifier"
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Restore the verified kit and install Hex dependencies
        run: |
          tar -xzf verified-release/kit-dist.tar.gz
          mix deps.get

      - name: Confirm the rebuilt Hex package matches the verified artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mix hex.build --output rebuilt.tar
          cmp rebuilt.tar "verified-release/agent_blueprint_protocol-${VERSION}.tar"

      - name: Publish the Hex package and docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "::warning::Hex publish skipped: HEX_API_KEY absent"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # The releases LIST lives on the package object (the /releases
          # suffix 404s with an HTML page, which grep never matches — the
          # old guard only ever passed by luck when nothing was published).
          if curl -sf "https://hex.pm/api/packages/agent_blueprint_protocol" | grep -q "\"version\":\"${VERSION}\""; then
            echo "hex: ${VERSION} already published — skipping (idempotent re-run or local bootstrap)"
          else
            yes | mix hex.publish
          fi

      - name: Attach the verifier kit to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — leaving it as-is (idempotent)"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "verified-release/verifier-${VERSION}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${VERSION} — installable verifier" \
            --generate-notes

      - name: Post-publish verification (registry install vs the tag)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! npm view "${NPM_PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "[staged-publish] ${NPM_PACKAGE}@${VERSION} is STAGED and not yet live."
            echo "A maintainer approves it (2FA) under the package's Staged Packages"
            echo "settings on npmjs.com; the install-vs-tag byte verification runs"
            echo "after approval. This is the designed flow — nothing verified here yet."
            exit 0
          fi
          mkdir /tmp/postpublish
          cd /tmp/postpublish
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "${NPM_PACKAGE}@${VERSION}"
          npx --no-install verifier > /tmp/kit-report.json
          cd "$GITHUB_WORKSPACE"
          ./agent_blueprint_protocol_conformance --corpus priv/conformance > /tmp/escript-report.json
          cmp /tmp/kit-report.json /tmp/escript-report.json
