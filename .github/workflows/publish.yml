name: Publish

# Owner-dispatched from the default branch, without inputs. Refuse unknown package
# names and an existing remote tag. A second dispatch on the same commit finishes
# a held release (npm staged approval or Hex), uploading only what is missing.
# npm uses trusted publishing with provenance in environment publish; no npm token.
# HEX_API_KEY lives there and reaches only the no-project upload step.
# No workflow creates a release or tag. release-assets is handed to infra, which
# reads the packages back, tags the published docs commit, creates the GitHub release, and dispatches Pages.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the dispatched source
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 8.6 min, run 44033341768.
    timeout-minutes: 18
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      npm: ${{ steps.npm.outputs.npm }}
      hex_package: ${{ steps.hex.outputs.package }}
      hex_docs: ${{ steps.hex.outputs.docs }}
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the default toolchain
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ steps.versions.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ steps.versions.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Read and compare the source package versions
        id: inputs
        run: |
          VERSION=$(node scripts/release_artifact_info.mjs version)
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse missing package names or an existing release tag
        run: bash scripts/check_publication.sh

      - name: Check public privacy over full history
        run: elixir scripts/check_public_privacy.exs scripts/public_privacy.json
        env:
          ABP_PUBLIC_PRIVACY_HMAC_KEY: ${{ secrets.ABP_PUBLIC_PRIVACY_HMAC_KEY }}

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Install dependencies and build the kit
        run: |
          mix deps.get --check-locked
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Check final-release promotion against its candidate
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "Candidate publication: final promotion does not apply"
          else
            mapfile -t CANDIDATES < <(git tag --list "v${VERSION}-rc.*" --sort=-version:refname)
            CANDIDATE="${CANDIDATES[0]:-}"
            if [ -z "$CANDIDATE" ]; then
              echo "::error::A final release requires a candidate tag"
              exit 1
            fi
            mix release.promote --check "$CANDIDATE"
          fi

      - name: Run the complete quality battery on the dispatched source
        run: mix quality

      - name: Prepare the verified release artifacts
        run: |
          mkdir verified-release
          cp spec/conformance/certified-results.json verified-release/certified-results.json
          npm pack ./dist/package --ignore-scripts --pack-destination verified-release
          env MIX_ENV=test mix release.asset --write
          mv "verifier-${VERSION}.tar.gz" verified-release/
          mix hex.build --output "verified-release/agent_blueprint_protocol-${VERSION}.tar"
          echo "Package checksum: $(sha256sum "verified-release/agent_blueprint_protocol-${VERSION}.tar" | cut -d' ' -f1)"
          tar -czf verified-release/kit-dist.tar.gz \
            --exclude='.DS_Store' --exclude='._*' dist agent_blueprint_protocol_conformance

      - name: Verify the packed npm artifact
        run: |
          mkdir "$RUNNER_TEMP/packed-kit"
          tar -xzf "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" \
            -C "$RUNNER_TEMP/packed-kit"
          diff --recursive --brief --exclude='package' --exclude='self_checks.*' \
            --exclude='.DS_Store' --exclude='._*' dist "$RUNNER_TEMP/packed-kit/package/dist"
          node "$RUNNER_TEMP/packed-kit/package/dist/kit/cli.mjs" \
            > "$RUNNER_TEMP/packed-report.json"
          escript agent_blueprint_protocol_conformance --corpus priv/conformance \
            > "$RUNNER_TEMP/verified-report.json"
          cmp "$RUNNER_TEMP/packed-report.json" "$RUNNER_TEMP/verified-report.json"

      - name: Verify both built release packages
        run: |
          elixir scripts/verify_release_packages.exs --local \
            "verified-release/agent_blueprint_protocol-${VERSION}.tar" \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz"

      - name: Prepare the verified documentation archive
        env:
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          release = {"package": "agent_blueprint_protocol", "version": os.environ["VERSION"], "commit": os.environ["DISPATCHED_SHA"]}
          Path("doc/release.json").write_text(json.dumps(release, separators=(",", ":")) + "\n", encoding="utf-8")
          PYTHON
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -cf - -C doc . | gzip -n > verified-release/hex-docs.tar.gz
          (cd verified-release && mix run --no-mix-exs ../scripts/hex_release_state.exs docs-provenance \
            agent_blueprint_protocol "$VERSION" hex-docs.tar.gz "$DISPATCHED_SHA" "$GITHUB_WORKSPACE")
          echo "Docs checksum: $(sha256sum verified-release/hex-docs.tar.gz | cut -d' ' -f1)"

      - name: Plan the npm upload
        id: npm
        run: |
          node scripts/npm_release_state.mjs plan "$VERSION" \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz"

      - name: Plan the Hex uploads
        id: hex
        working-directory: verified-release
        run: |
          mix run --no-mix-exs ../scripts/hex_release_state.exs plan \
            agent_blueprint_protocol "$VERSION" "agent_blueprint_protocol-${VERSION}.tar"

      - name: Refuse inconsistent registry state
        env:
          NPM_STATE: ${{ steps.npm.outputs.npm }}
          HEX_PACKAGE: ${{ steps.hex.outputs.package }}
          HEX_DOCS: ${{ steps.hex.outputs.docs }}
        run: |
          if [ "$NPM_STATE" = upload ] && { [ "$HEX_PACKAGE" = served ] || [ "$HEX_DOCS" = served ]; }; then
            echo "::error::Hex is served while npm is absent; inconsistent registry state"
            exit 1
          fi

      - name: Prepare consumer release assets
        run: |
          mkdir verified-release/release-assets
          cp "verified-release/agent_blueprint_protocol-${VERSION}.tar" \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" \
            "verified-release/verifier-${VERSION}.tar.gz" \
            verified-release/certified-results.json verified-release/release-assets/
          elixir scripts/release_notes.exs "$VERSION" verified-release/release-assets/release-notes.md
          (cd verified-release/release-assets && sha256sum -- * > SHA256SUMS)

      - name: Upload the verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: verified-release/
          if-no-files-found: error

  npm-publish:
    name: Stage the npm package
    needs: verify
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 0.3 min, run 44033341768.
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      NPM_PACKAGE: "@agent-blueprint-protocol/verifier"
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the default toolchain
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Publish the npm kit (staged trusted publishing, provenance)
        if: needs.verify.outputs.npm == 'upload'
        run: |
          npm install -g --ignore-scripts npm@11.19.1 >/dev/null
          npm --version
          NPM_TAG=latest
          if [[ "${VERSION%%+*}" == *-* ]]; then NPM_TAG=rc; fi
          if ! npm stage publish \
            "./verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz" \
            --ignore-scripts --access public --provenance --tag "$NPM_TAG"; then
            echo "::error::npm upload failed or staging slot occupied; approve staged bytes on npmjs.com if held, then dispatch Publish again on the same commit; the next run uploads only what is missing."
            exit 1
          fi

      - name: Read back the served npm version
        run: |
          node scripts/npm_release_state.mjs read-back "$VERSION" \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz"

  npm-kit:
    name: Check the published npm kit
    needs: [verify, npm-publish]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # Split out of hex-publish; that whole job, including this check, bounds it.
    # Twice the slowest green run, at least 5 min: 1.1 min, run 44085034568.
    timeout-minutes: 5
    env:
      NPM_PACKAGE: "@agent-blueprint-protocol/verifier"
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the default toolchain
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ steps.versions.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ steps.versions.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Restore the verified kit
        run: tar -xzf verified-release/kit-dist.tar.gz

      - name: Verify the live npm version and the installed kit
        run: |
          LIVE_INTEGRITY=$(npm view "${NPM_PACKAGE}@${VERSION}" dist.integrity)
          VERIFIED_INTEGRITY=$(node scripts/release_artifact_info.mjs npm-integrity \
            "verified-release/agent-blueprint-protocol-verifier-${VERSION}.tgz")
          if [ "$LIVE_INTEGRITY" != "$VERIFIED_INTEGRITY" ]; then
            echo "::error::Live npm bytes differ from the verified archive; publication refused"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/published-kit"
          cd "$RUNNER_TEMP/published-kit"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "${NPM_PACKAGE}@${VERSION}"
          npx --no-install verifier > "$RUNNER_TEMP/kit-report.json"
          cd "$GITHUB_WORKSPACE"
          escript agent_blueprint_protocol_conformance --corpus priv/conformance \
            > "$RUNNER_TEMP/escript-report.json"
          cmp "$RUNNER_TEMP/kit-report.json" "$RUNNER_TEMP/escript-report.json"

  hex-publish:
    name: Publish Hex and docs
    needs: [verify, npm-kit]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    # Twice the slowest green run, at least 5 min: 1.1 min, run 44085034568.
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Refuse refs outside the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the default toolchain
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ steps.versions.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ steps.versions.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force

      - name: Download the verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: verified-release

      - name: Publish the verified Hex archive and docs to public hexpm
        if: needs.verify.outputs.hex_package == 'upload' || needs.verify.outputs.hex_docs == 'upload'
        working-directory: verified-release
        env:
          HEX_PACKAGE: ${{ needs.verify.outputs.hex_package }}
          HEX_DOCS: ${{ needs.verify.outputs.hex_docs }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          set -- agent_blueprint_protocol "$VERSION"
          if [ "$HEX_PACKAGE" = upload ]; then set -- "$@" --package "agent_blueprint_protocol-${VERSION}.tar"; fi
          if [ "$HEX_DOCS" = upload ]; then set -- "$@" --docs hex-docs.tar.gz; fi
          mix run --no-mix-exs ../scripts/publish_hex_artifacts.exs "$@"

      - name: Read back the served Hex package and docs
        working-directory: verified-release
        env:
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          mix run --no-mix-exs ../scripts/hex_release_state.exs read-back \
            agent_blueprint_protocol "$VERSION" "agent_blueprint_protocol-${VERSION}.tar" \
            "release-assets/hex-docs-${VERSION}.tar.gz" "$DISPATCHED_SHA" "$GITHUB_WORKSPACE"
          (cd release-assets && sha256sum -- "hex-docs-${VERSION}.tar.gz" >> SHA256SUMS)

      - name: Hand consumer release assets to infra
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: verified-release/release-assets/
          if-no-files-found: error

  smoke:
    needs: [verify, hex-publish]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    permissions:
      contents: read
    name: Published kit — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Measured as this repository's postpublish.yml smoke job.
    # Twice the slowest green run, at least 5 min: 0.5 min, run 44085034568.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Refuse refs outside the default branch
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      - name: Check out smoke script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the default toolchain
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Install the published package and verify its corpus
        env:
          ABP_VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/postpublish_smoke.mjs "$env:ABP_VERSION"
        shell: pwsh

  livebooks:
    needs: [verify, hex-publish]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    permissions:
      contents: read
    name: Published consumer examples - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Measured as this repository's postpublish.yml livebooks job.
    # Twice the slowest green run, at least 5 min: 2.9 min, run 44022461020.
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Refuse refs outside the default branch
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publication requires the default branch"
            exit 1
          fi

      # Publish uses the dispatched commit.
      # Full history supplies the earlier censuses and signed 0.8.x goldens.
      - name: Check out the consumer driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the default toolchain
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          package-manager-cache: false

      - name: Verify installed Node versions
        shell: bash
        env:
          TOOLCHAIN_NODEJS: ${{ steps.versions.outputs.nodejs }}
        run: scripts/toolchain.sh --installed nodejs="$TOOLCHAIN_NODEJS"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Verify installed BEAM versions
        shell: bash
        env:
          TOOLCHAIN_ELIXIR: ${{ steps.versions.outputs.elixir }}
          TOOLCHAIN_ERLANG: ${{ steps.versions.outputs.otp }}
        run: scripts/toolchain.sh --installed elixir="$TOOLCHAIN_ELIXIR" erlang="$TOOLCHAIN_ERLANG"

      - name: Install the pinned Hex client
        run: mix local.hex 2.7.0 --force
        shell: pwsh
      - name: Verify the published packages and replay release history through them
        env:
          ABP_VERSION: ${{ needs.verify.outputs.version }}
        # Every consumer gate and example document is loaded from the
        # checksum-verified published packages. The checkout supplies only
        # transport, extraction, and the release tags the installed replay reads.
        run: elixir scripts/verify_release_packages.exs --registry "$env:ABP_VERSION"
        shell: pwsh
